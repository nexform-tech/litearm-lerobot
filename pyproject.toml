[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-lerobot"
# PLACEHOLDER — do not edit, do not read. semantic-release owns the version; the
# git tag is the only source of truth (AGENTS.md §3).
# AGENTS.md spells the placeholder `0.0.0-semantic-release`, but that is not valid
# PEP 440: setuptools refuses it (`project.version must be pep440`), which breaks
# the `pip install -e ".[dev]"` step of ci.yml. The `+` local-version form is the
# same intent and is valid. This repository publishes to no index (release.yml is
# the source-only shape), so the local label is inert. Same fix as
# litearm-studio/daemon, which is in the identical situation.
version = "0.0.0+semantic-release"
description = "LeRobot drivers for LiteArm and LiteArm with LiteGrip and one camera"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "luochun" }]
keywords = ["robotics", "robot-arm", "litearm", "lerobot"]
dependencies = [
    "litearm-python>=2.1.0",
    # The gripper SDK is not on PyPI; pin the upstream commit so an install
    # reproduces the API this adapter uses (fresh/data_age_s status fields).
    "litegrip @ git+https://github.com/nexform-tech/litegrip-python.git@0d46d6d8c598c0caa1ca863748dffb0328d5b80e",
    "lerobot>=0.3.0,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
